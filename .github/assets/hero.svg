<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
<defs>
  <radialGradient id="bg-mis" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="#001510"/>
    <stop offset="100%" stop-color="#0a0a0b"/>
  </radialGradient>
  <linearGradient id="bar-grad" x1="0%" y1="100%" x2="0%" y2="0%">
    <stop offset="0%" stop-color="#10b981"/>
    <stop offset="100%" stop-color="#06b6d4"/>
  </linearGradient>
</defs>
<rect width="1200" height="300" fill="url(#bg-mis)"/>

<!-- Equalizer bars - 20 bars centered, x from 350 to 850 -->
